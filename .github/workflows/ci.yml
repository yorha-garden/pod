# Builds Pod and runs its suite. There is no branch filter on pull_request,
# so stacked PRs — whose base is another feature branch — get checks too.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # Pinned rather than macos-latest, so a new image cannot change the
    # toolchain underneath a green PR. Arm64, like the machines Pod runs on.
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: ./Scripts/test.sh
